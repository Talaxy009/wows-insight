name: Release

# 手动触发：打包已签名的 Android APK 与未签名的 iOS IPA，并发布到同一个 GitHub Release。
# 版本号取输入的 version；留空时使用仓库根目录 version.xcconfig 的 VERSION_NAME，
# 两个平台的 versionName / MARKETING_VERSION 都来自这一份共享文件。

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 1.2.0 留空则使用 version.xcconfig 配置）'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version and tag
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          version="${INPUT_VERSION:-}"
          version="${version//[[:space:]]/}"
          version="${version#v}"

          if [[ -z "${version}" ]]; then
            version="$(sed -nE 's/^[[:space:]]*VERSION_NAME[[:space:]]*=[[:space:]]*([^[:space:]]+).*$/\1/p' \
              version.xcconfig | sed -n '1p')"
            echo "未输入版本号，使用 version.xcconfig 的 VERSION_NAME=${version}"
          fi

          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "版本号格式不合法：${version}（应为 1.0.1 这样的形式）" >&2
            exit 1
          fi

          tag="v${version}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "标签 ${tag} 已存在，请换一个版本号" >&2
            exit 1
          fi

          {
            echo "version=${version}"
            echo "tag=${tag}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Release ${tag}"
            echo ""
            echo "- 版本：\`${version}\`"
            echo "- 提交：\`${GITHUB_SHA}\`"
            echo "- 产物：iOS IPA（未签名）+ Android APK（已签名）"
          } >> "$GITHUB_STEP_SUMMARY"

  ios:
    name: Build iOS IPA
    needs: version
    # 需要带 iOS 27 SDK 的 Xcode：用旧 SDK 构建的包在 iOS 26+ 上会跑兼容外观，
    # 界面和用 Xcode 27 本地构建出来的不一致。xcode-27 镜像目前是 preview 标签，
    # 将来 GA 后再改成 macos-27。
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Archive
        env:
          VERSION: ${{ needs.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project ios/WoWsInsight.xcodeproj \
            -scheme WoWsInsight \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/WoWsInsight.xcarchive \
            MARKETING_VERSION="${VERSION}" \
            CURRENT_PROJECT_VERSION="${BUILD_NUMBER}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -quiet

      - name: Package IPA
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail

          app="build/WoWsInsight.xcarchive/Products/Applications/WoWsInsight.app"
          if [[ ! -d "${app}" ]]; then
            echo "找不到归档产物：${app}" >&2
            find build/WoWsInsight.xcarchive/Products -maxdepth 3 >&2
            exit 1
          fi

          # IPA 就是「Payload/XXX.app」的 zip 包
          mkdir -p build/Payload
          cp -R "${app}" build/Payload/

          cd build
          zip -qry "WoWsInsight-${VERSION}.ipa" Payload
          rm -rf Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: ios-ipa
          path: build/*.ipa
          if-no-files-found: error
          retention-days: 14

  android:
    name: Build signed Android APK
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?缺少 secret ANDROID_KEYSTORE_BASE64}"
          : "${KEYSTORE_PASSWORD:?缺少 secret ANDROID_KEYSTORE_PASSWORD}"
          : "${KEY_ALIAS:?缺少 secret ANDROID_KEY_ALIAS}"
          : "${KEY_PASSWORD:?缺少 secret ANDROID_KEY_PASSWORD}"

          keystore="${RUNNER_TEMP}/release.keystore"
          printf '%s' "${KEYSTORE_BASE64}" | tr -d '\r\n ' | base64 --decode > "${keystore}"
          [[ -s "${keystore}" ]] || { echo "keystore 解码失败或为空" >&2; exit 1; }

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION: ${{ needs.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          ./gradlew :app:assembleRelease \
            -PversionName="${VERSION}" \
            -PversionCode="${BUILD_NUMBER}"

      - name: Collect signed APK
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # 未签名时产物名是 *-release-unsigned.apk，这里的 cp 会直接失败
          mkdir -p ../build
          cp "app/build/outputs/apk/release/WoWsInsight-${VERSION}-release.apk" \
            "../build/WoWsInsight-${VERSION}.apk"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: build/WoWsInsight-*.apk
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    needs: [version, ios, android]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github

      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail

          ls -l dist

          gh release create "${TAG}" \
            "dist/WoWsInsight-${VERSION}.ipa" \
            "dist/WoWsInsight-${VERSION}.apk" \
            --target "${GITHUB_SHA}" \
            --title "WoWs Insight ${VERSION}" \
            --notes-file .github/release-notes.md \
            --generate-notes
